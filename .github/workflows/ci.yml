name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-ui-and-test:
    name: Build UI, Clippy, Rust Security Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, audit, and build UI bundle
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm run build

      - name: Validate browser SDK and shell script syntax
        run: |
          node --check sdks/browser/bugfinder-mini.js
          node --check sdks/browser/bugfinder-shield.js
          bash -n scripts/check.sh scripts/install.sh scripts/build-release.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.89
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Run native Rust security invariant linter
        run: cargo run --locked -- lint --dir .

      - name: Audit Cargo.lock against OSV RustSec advisories
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request
          IGNORED = {"RUSTSEC-2026-0543"}  # informational unmaintained notice on chrono
          pkgs = []
          with open("Cargo.lock", "r", encoding="utf-8") as f:
              for blk in f.read().split("[[package]]")[1:]:
                  mn = re.search(r'^name\s*=\s*"([^"]+)"', blk, re.M)
                  mv = re.search(r'^version\s*=\s*"([^"]+)"', blk, re.M)
                  if mn and mv:
                      pkgs.append((mn.group(1), mv.group(1)))
          payload = {"queries": [{"package": {"ecosystem": "crates.io", "name": n}, "version": v} for n, v in pkgs]}
          req = urllib.request.Request("https://api.osv.dev/v1/querybatch", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as r:
              res = json.loads(r.read().decode())
          bad = []
          for (n, v), item in zip(pkgs, res.get("results", [])):
              for vuln in item.get("vulns", []):
                  vid = vuln.get("id", "")
                  if vid and vid not in IGNORED:
                      bad.append(f"{n}@{v} -> {vid}")
          if bad:
              print("Active RustSec/CVE advisories found:\n" + "\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"OSV Cargo.lock audit PASS ({len(pkgs)} crates scanned, 0 active CVEs)")
          PY

      - name: Run clippy with -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust unit and integration tests
        run: cargo test --all-features

  postgres-rls-live:
    name: PostgreSQL 17 FORCE RLS Live Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_password
          POSTGRES_DB: bugfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bugfinder_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build UI bundle for build.rs
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.89
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Provision NOBYPASSRLS runtime role and execute PG17 RLS test suite
        env:
          BUGFINDER_TEST_PG_ADMIN_URL: postgres://postgres:ci_pg_admin_password@127.0.0.1:5432/bugfinder_test
          BUGFINDER_TEST_PG_APP_URL: postgres://bugfinder_app:ci_pg_app_password@127.0.0.1:5432/bugfinder_test
        run: |
          psql "$BUGFINDER_TEST_PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE bugfinder_app LOGIN PASSWORD 'ci_pg_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql "$BUGFINDER_TEST_PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO bugfinder_app;"
          cargo test --test integration_tests postgres_rls_live_isolation_test -- --ignored --nocapture
