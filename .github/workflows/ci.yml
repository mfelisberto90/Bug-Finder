name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-ui-and-test:
    name: Build UI, Clippy, Security Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, audit, and build UI bundle
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm run build

      - name: Validate browser SDK syntax
        run: |
          node --check sdks/browser/bugfinder-mini.js
          node --check sdks/browser/bugfinder-shield.js

      - name: Run security invariant linter
        run: python3 scripts/security-lint.py

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy with -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust unit and integration tests
        run: cargo test --all-features

  postgres-rls-live:
    name: PostgreSQL 17 FORCE RLS Live Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_password
          POSTGRES_DB: bugfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bugfinder_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build UI bundle for build.rs
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@v2

      - name: Provision NOBYPASSRLS runtime role and execute PG17 RLS test suite
        env:
          BUGFINDER_TEST_PG_ADMIN_URL: postgres://postgres:ci_pg_admin_password@127.0.0.1:5432/bugfinder_test
          BUGFINDER_TEST_PG_APP_URL: postgres://bugfinder_app:ci_pg_app_password@127.0.0.1:5432/bugfinder_test
        run: |
          psql "$BUGFINDER_TEST_PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE bugfinder_app LOGIN PASSWORD 'ci_pg_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql "$BUGFINDER_TEST_PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO bugfinder_app;"
          cargo test --test integration_tests postgres_rls_live_isolation_test -- --ignored --nocapture
