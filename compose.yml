services:
  bugfinder:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      BUGFINDER_BIND: "0.0.0.0:8080"
      BUGFINDER_DATA_DIR: "/data"
      BUGFINDER_MAX_DB_MB: "512"
      BUGFINDER_RETENTION_DAYS: "30"
    volumes:
      - bugfinder_data:/data
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  bugfinder_data:
